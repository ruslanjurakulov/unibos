name: unibos-local
services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:local}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run setup:local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.6.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run npm run setup:local}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
